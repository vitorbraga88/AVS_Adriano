{% extends "base.html" %}
{% block title %}Editar equipamento — AVS{% endblock %}
{% block content %}
<h1>Editar equipamento</h1>

<div class="card">
  <form method="post" action="equipamentos/{{ e.id }}">
    <div class="row">
      <div>
        <label for="cliente_id">Cliente</label>
        <select id="cliente_id" name="cliente_id" required>
          {% for c in clientes %}
          <option value="{{ c.id }}"{% if c.id == e.cliente_id %} selected{% endif %}>{{ c.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" value="{{ e.descricao or '' }}">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="marca">Marca</label>
        <input type="text" id="marca" name="marca" value="{{ e.marca or '' }}">
      </div>
      <div>
        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" value="{{ e.modelo or '' }}">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="numero_serie">Nº de série</label>
        <input type="text" id="numero_serie" name="numero_serie" value="{{ e.numero_serie or '' }}">
      </div>
      <div>
        <label for="patrimonio">Patrimônio</label>
        <input type="text" id="patrimonio" name="patrimonio" value="{{ e.patrimonio or '' }}">
      </div>
    </div>
    <label for="observacoes">Observações</label>
    <textarea id="observacoes" name="observacoes">{{ e.observacoes or '' }}</textarea>
    <div class="actions">
      <button type="submit" class="btn">&#9889; Salvar</button>
      <a class="btn sec" href="equipamentos">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
